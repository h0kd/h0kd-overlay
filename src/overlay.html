<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    #overlay {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .video-spawn {
      position: absolute;
      pointer-events: none;
      /* La animación de entrada/salida se asigna por instancia (ver IN_ANIMS/OUT_ANIMS). */
    }

    .video-spawn video {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Transiciones de entrada ───────────────────────────────────────────── */
    @keyframes inPop        { from { opacity: 0; transform: scale(0.75); }      to { opacity: 1; transform: none; } }
    @keyframes inFade       { from { opacity: 0; }                              to { opacity: 1; } }
    @keyframes inZoom       { from { opacity: 0; transform: scale(0.4); }       to { opacity: 1; transform: none; } }
    @keyframes inSlideUp    { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: none; } }
    @keyframes inSlideDown  { from { opacity: 0; transform: translateY(-50px); }to { opacity: 1; transform: none; } }
    @keyframes inSlideLeft  { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: none; } }
    @keyframes inSlideRight { from { opacity: 0; transform: translateX(-50px); }to { opacity: 1; transform: none; } }

    /* ── Transiciones de salida ────────────────────────────────────────────── */
    @keyframes outPop        { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(0.75); } }
    @keyframes outFade       { from { opacity: 1; }                  to { opacity: 0; } }
    @keyframes outZoom       { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(0.4); } }
    @keyframes outSlideUp    { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-50px); } }
    @keyframes outSlideDown  { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(50px); } }
    @keyframes outSlideLeft  { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-50px); } }
    @keyframes outSlideRight { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(50px); } }

    /* ── Video Requests ──────────────────────────────────────────────────────
       Contenedor propio, aparte del spawn de los canjes. El video se ubica y
       dimensiona por JS (ver placeRequest) recién cuando se conoce su
       proporción real: así conviven Reels verticales 9:16 con clips 16:9 sin
       deformar ninguno, y la posición (fija o al azar) se calcula con el
       tamaño que de verdad va a ocupar. */
    #vrStage {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }
    #vrStage.on { display: block; }
    #vrStage video {
      position: absolute;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
      /* Invisible hasta que placeRequest lo ubica: si no, un frame en (0,0). */
      visibility: hidden;
    }
    #vrStage video.placed { visibility: visible; }

    /* ── Setup status badge ──────────────────────────────────────────────────
       Visible ONLY while configuring (page load → first successful connection).
       After the overlay connects once it is removed for good, so it can never
       appear on a live stream during a later reconnect. */
    #setupStatus {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #efeff1;
      background: rgba(20, 20, 23, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      transition: opacity 0.5s ease;
    }
    #setupStatus .dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: #f0a000; box-shadow: 0 0 8px #f0a000;
    }
    #setupStatus.connected .dot { background: #00d563; box-shadow: 0 0 8px #00d563; }
    #setupStatus.connected { border-color: rgba(0, 213, 99, 0.4); }
    #setupStatus.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="vrStage"></div>
  <div id="setupStatus"><span class="dot"></span><span id="setupStatusText">Conectando al servidor…</span></div>

  <script>
    // ── Constants ────────────────────────────────────────────────────────────
    // Derived from wherever the overlay was served, so the same file works
    // unchanged on the stable build (3001) and the experimental one (3002).
    const WS_URL              = 'ws://' + location.host + '/';
    const WS_RECONNECT_DELAY  = 3000;  // ms
    const MAX_POS_ATTEMPTS    = 30;
    const CONFIG_PATH         = './config.json';
    const REMOVE_ANIM_BUDGET  = 500;   // ms fallback after the out-animation is applied

    // ── Transiciones (mismo set que ofrece el panel) ──────────────────────────
    // key → string CSS `animation`. "none" = sin animación (instantáneo).
    const IN_ANIMS = {
      pop:        'inPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
      fade:       'inFade 0.3s ease-out forwards',
      zoom:       'inZoom 0.35s ease-out forwards',
      slideUp:    'inSlideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards',
      slideDown:  'inSlideDown 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards',
      slideLeft:  'inSlideLeft 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards',
      slideRight: 'inSlideRight 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards'
    };
    const OUT_ANIMS = {
      pop:        'outPop 0.25s ease-in forwards',
      fade:       'outFade 0.3s ease-in forwards',
      zoom:       'outZoom 0.3s ease-in forwards',
      slideUp:    'outSlideUp 0.35s ease-in forwards',
      slideDown:  'outSlideDown 0.35s ease-in forwards',
      slideLeft:  'outSlideLeft 0.35s ease-in forwards',
      slideRight: 'outSlideRight 0.35s ease-in forwards'
    };

    // ── Video Requests ───────────────────────────────────────────────────────
    // El agente necesita saber cuándo la pantalla quedó libre para largar el
    // siguiente pedido. Se lo decimos nosotros en vez de que lo adivine por
    // duración: un video que falla al cargar termina en 0s y uno con audio
    // desincronizado dura más de lo que decía su metadata.
    let vrPlaying = null;        // itemId en pantalla, o null
    let vrLastBusy = null;       // último valor reportado, para no repetir

    function overlayBusy() {
      return document.querySelectorAll('.video-spawn').length > 0 || vrPlaying !== null;
    }

    function reportBusy() {
      const busy = overlayBusy();
      if (busy === vrLastBusy) return;
      vrLastBusy = busy;
      wsSend({ type: 'overlayBusy', busy: busy });
    }

    function wsSend(obj) {
      if (!ws || ws.readyState !== 1) return;
      try { ws.send(JSON.stringify(obj)); } catch (_) {}
    }

    // Dónde y de qué tamaño salen los pedidos. Vive en config.json bajo
    // `videoRequests` (se edita en la pestaña Video Requests del panel) y sin
    // nada configurado da lo de siempre: centrado, al 62% de la pantalla.
    function vrLayout() {
      const c = config.videoRequests || {};
      const cW = config.canvas.width;
      const cH = config.canvas.height;
      const pct = (typeof c.sizePct === 'number') ? Math.max(5, Math.min(100, c.sizePct)) : 62;
      return {
        random: c.position === 'random',
        cx: (typeof c.x === 'number') ? c.x : cW / 2,
        cy: (typeof c.y === 'number') ? c.y : cH / 2,
        pct: pct,
        respectZones: c.respectSafeZones !== false,
        animIn: c.animIn || 'pop',
        animOut: c.animOut || 'pop',
        // Los pedidos salían siempre al 100% y en stream se escuchaban muy
        // fuerte al lado de todo lo demás. Mismo rango que los canjes.
        volume: (typeof c.volume === 'number') ? Math.min(1, Math.max(0, c.volume)) : 0.8
      };
    }

    // Ubica y dimensiona el video una vez conocida su proporción real.
    // 100% = el video llena la pantalla sin recortarse, la misma regla que el
    // tamaño de los canjes, así el mismo % se ve igual en vertical y horizontal.
    function placeRequest(video, vw, vh) {
      const L = vrLayout();
      const cW = config.canvas.width;
      const cH = config.canvas.height;
      const fs = Math.min(cW / vw, cH / vh) * L.pct / 100;
      const fw = Math.max(1, Math.round(vw * fs));
      const fh = Math.max(1, Math.round(vh * fs));
      let x, y;
      if (L.random) {
        const p = randomPosition(fw, fh, L.respectZones);
        x = p.x; y = p.y;
      } else {
        // La posición fija es el CENTRO del video: así la misma elección
        // sirve para un Reel y para un clip aunque ocupen cajas distintas.
        x = Math.round(L.cx - fw / 2);
        y = Math.round(L.cy - fh / 2);
      }
      x = Math.max(0, Math.min(x, cW - fw));
      y = Math.max(0, Math.min(y, cH - fh));
      Object.assign(video.style, {
        left: x + 'px', top: y + 'px', width: fw + 'px', height: fh + 'px'
      });
      if (L.animIn !== 'none' && IN_ANIMS[L.animIn]) video.style.animation = IN_ANIMS[L.animIn];
      video.classList.add('placed');
      log(`  → pos=(${x},${y}) ${fw}×${fh} ${L.random ? 'al azar' : 'fija'} ${L.pct}%`);
    }

    function playRequest(data) {
      const stage = document.getElementById('vrStage');
      stage.textContent = '';
      stage.classList.add('on');

      const video = document.createElement('video');
      video.src = data.src;
      video.autoplay = true;
      video.playsInline = true;
      video.volume = vrLayout().volume;

      let done = false;
      let guard = null;
      const started = Date.now();

      function finish(reason) {
        if (done) return;
        done = true;
        clearTimeout(guard);
        const L = vrLayout();
        const out = OUT_ANIMS[L.animOut];
        const animated = L.animOut !== 'none' && !!out && video.classList.contains('placed');
        if (animated) video.style.animation = out;
        setTimeout(function () {
          // Solo si nadie puso otro pedido en el medio.
          if (video.parentNode === stage) {
            stage.classList.remove('on');
            stage.textContent = '';
          }
        }, animated ? REMOVE_ANIM_BUDGET : 0);
        const seconds = (Date.now() - started) / 1000;
        vrPlaying = null;
        wsSend({ type: 'requestEnded', itemId: data.itemId, seconds: seconds, reason: reason });
        reportBusy();
      }

      // Red de contención: si el archivo no dispara 'ended' (códec raro, red
      // cortada), el pedido no puede quedarse trabado para siempre bloqueando
      // la cola entera.
      //
      // El plazo NO puede ser fijo. /admin deja aprobar hasta 120 s, así que
      // un tope de 60 cortaría el video por la mitad, en pantalla y en vivo, y
      // encima lo reportaría como error. Arranca corto —lo que tarda en abrir
      // un mp4 que ya está en disco— y se rearma con la duración real apenas
      // se conoce.
      function armGuard(ms) {
        clearTimeout(guard);
        guard = setTimeout(function () {
          warn('Video request sin \'ended\'; se cierra por tiempo:', data.itemId);
          finish('error');
        }, ms);
      }
      armGuard(30000);

      video.addEventListener('loadedmetadata', function () {
        const d = isFinite(video.duration) && video.duration > 0 ? video.duration : 0;
        armGuard(Math.round((d + 15) * 1000));
        placeRequest(video, video.videoWidth || 16, video.videoHeight || 9);
      });

      video.addEventListener('ended', function () { finish('ended'); });
      video.addEventListener('error', function () {
        err('No se pudo reproducir el pedido:', data.src);
        finish('error');
      });

      stage.appendChild(video);
      // OBS deja arrancar con sonido sin que nadie toque nada; un navegador
      // normal (alguien abriendo el overlay en Chrome para mirarlo) lo bloquea.
      // Sin este catch, ese bloqueo se vería como un cuadro congelado hasta que
      // saltara el plazo, con la cola detrás esperando.
      const playing = video.play();
      if (playing && playing.catch) {
        playing.catch(function (e) {
          err('No se pudo arrancar el pedido (¿autoplay bloqueado?):', e);
          finish('error');
        });
      }

      vrPlaying = data.itemId;
      wsSend({ type: 'requestStarted', itemId: data.itemId });
      reportBusy();
      log('Video request en pantalla:', data.itemId);
    }

    // ── State ────────────────────────────────────────────────────────────────
    let config = {
      rewards:   {},
      safeZones: { exclude: [] },
      canvas:    { width: 1920, height: 1080 },
      videoRequests: {}
    };
    let ws = null;
    let wsReconnectTimer = null;
    // `boot` de la app en la primera conexión. Si cambia, la app se reinició.
    let bootSeen = null;

    // ── Setup status badge ────────────────────────────────────────────────────
    // Shows "Conectando…" from load until the first successful connection, then
    // flips to "✓ Conectado" and removes itself permanently. It never reappears
    // on a later reconnect, so it can't show up mid-stream. Disable entirely with
    // ?silent (or ?nostatus) in the OBS Browser Source URL.
    const setupBadge = (() => {
      const el = document.getElementById('setupStatus');
      const q  = new URLSearchParams(location.search);
      const disabled = q.has('silent') || q.has('nostatus');
      let done = false;
      if (disabled && el) el.remove();
      return {
        connected() {
          if (done || disabled || !el) return;
          done = true;
          el.classList.add('connected');
          document.getElementById('setupStatusText').textContent = '✓ Conectado — ya podés cerrar esto';
          setTimeout(() => el.classList.add('hidden'), 1500);
          setTimeout(() => { if (el.parentNode) el.remove(); }, 2100);
        }
      };
    })();

    // ── Logging ──────────────────────────────────────────────────────────────
    const log   = (...a) => console.log('[Overlay]', ...a);
    const logWS = (...a) => console.log('[WS]',      ...a);
    const warn  = (...a) => console.warn('[Overlay]', ...a);
    const err   = (...a) => console.error('[Overlay]', ...a);

    // ── Config ───────────────────────────────────────────────────────────────
    async function loadConfig() {
      try {
        const res = await fetch(CONFIG_PATH + '?t=' + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();
        config = {
          rewards:   raw.rewards   || {},
          safeZones: raw.safeZones || { exclude: [] },
          canvas:    raw.canvas    || { width: 1920, height: 1080 },
          videoRequests: raw.videoRequests || {}
        };
        const w = config.canvas.width;
        const h = config.canvas.height;
        document.documentElement.style.cssText = `width:${w}px;height:${h}px`;
        document.body.style.cssText            = `width:${w}px;height:${h}px`;
        log(`Config loaded — ${Object.keys(config.rewards).length} reward(s), canvas ${w}×${h}`);
      } catch (e) {
        err('Failed to load config:', e.message, '— using empty config');
      }
    }

    // ── Safe-zone helpers ────────────────────────────────────────────────────
    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function randomPosition(vidW, vidH, respectSafeZones) {
      const cW = config.canvas.width;
      const cH = config.canvas.height;
      const maxX = Math.max(0, cW - vidW);
      const maxY = Math.max(0, cH - vidH);
      const zones = respectSafeZones
        ? (config.safeZones && config.safeZones.exclude) || []
        : [];

      for (let i = 0; i < MAX_POS_ATTEMPTS; i++) {
        const x = Math.floor(Math.random() * (maxX + 1));
        const y = Math.floor(Math.random() * (maxY + 1));
        if (!zones.some(z => rectsOverlap(x, y, vidW, vidH, z.x, z.y, z.width, z.height))) {
          return { x, y };
        }
      }
      warn(`No safe position after ${MAX_POS_ATTEMPTS} attempts — spawning anyway`);
      return {
        x: Math.floor(Math.random() * (maxX + 1)),
        y: Math.floor(Math.random() * (maxY + 1))
      };
    }

    // ── Video spawning ───────────────────────────────────────────────────────
    function spawnVideo(rewardName) {
      const rc = config.rewards[rewardName];
      if (!rc) { warn(`No mapping for reward: "${rewardName}"`); return; }

      const videos = rc.videos;
      if (!videos || videos.length === 0) { warn(`No videos for reward: "${rewardName}"`); return; }

      // playback mode: "all" spawns every video at once, otherwise pick 1 at random.
      const playAll = rc.playback === 'all';
      const chosen  = playAll ? videos.slice() : [videos[Math.floor(Math.random() * videos.length)]];
      log(`Spawning "${rewardName}" (${playAll ? 'all' : 'random'}) → ${chosen.length} video(s)`);
      chosen.forEach(src => spawnOne(rewardName, rc, src));
    }

    function spawnOne(rewardName, rc, src) {
      const width          = rc.width       || 480;
      const height         = rc.height      || 270;
      const volume         = rc.volume      !== undefined ? Math.min(1, Math.max(0, rc.volume)) : 1.0;
      const maxDuration    = rc.maxDuration || 30000;
      const respectZones   = rc.respectSafeZones !== false;
      const animIn         = rc.animIn  || 'pop';   // default = comportamiento previo
      const animOut        = rc.animOut || 'pop';

      const { x, y } = randomPosition(width, height, respectZones);
      log(`  → ${src}  vol=${volume}  pos=(${x},${y})`);

      const wrapper = document.createElement('div');
      wrapper.className = 'video-spawn';
      Object.assign(wrapper.style, {
        left:   x + 'px',
        top:    y + 'px',
        width:  width  + 'px',
        height: height + 'px'
      });
      if (animIn !== 'none' && IN_ANIMS[animIn]) wrapper.style.animation = IN_ANIMS[animIn];

      const video = document.createElement('video');
      video.src         = src;
      video.volume      = volume;
      video.autoplay    = true;
      video.playsInline = true;

      video.addEventListener('loadedmetadata', () => {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) return;
        // Scale to fit within configured max width/height preserving aspect ratio
        const scale = Math.min(width / vw, height / vh);
        const fw = Math.round(vw * scale);
        const fh = Math.round(vh * scale);
        wrapper.style.width  = fw + 'px';
        wrapper.style.height = fh + 'px';
        // Clamp position so it stays within canvas
        const cx = Math.max(0, Math.min(parseInt(wrapper.style.left), config.canvas.width  - fw));
        const cy = Math.max(0, Math.min(parseInt(wrapper.style.top),  config.canvas.height - fh));
        wrapper.style.left = cx + 'px';
        wrapper.style.top  = cy + 'px';
      });

      let cleaning = false;
      function cleanup() {
        if (cleaning) return;   // 'ended' + safety timer pueden dispararse juntos
        cleaning = true;
        clearTimeout(safetyTimer);
        const removeEl = () => {
          if (wrapper.parentNode) wrapper.remove();
          reportBusy();
        };
        const out = OUT_ANIMS[animOut];
        if (animOut !== 'none' && out) {
          wrapper.style.animation = out;
          wrapper.addEventListener('animationend', removeEl, { once: true });
          setTimeout(removeEl, REMOVE_ANIM_BUDGET);
        } else {
          removeEl();
        }
      }

      const safetyTimer = setTimeout(() => {
        warn(`Safety timeout hit for: ${src}`);
        cleanup();
      }, maxDuration);

      video.addEventListener('ended', cleanup);
      video.addEventListener('error', () => { err(`Video error: ${src}`); cleanup(); });

      wrapper.appendChild(video);
      document.getElementById('overlay').appendChild(wrapper);
      reportBusy();
    }

    // Exposed for manual console testing (step 8.3 of planning doc)
    window.spawnVideo = spawnVideo;

    // ── WebSocket ────────────────────────────────────────────────────────────
    function connect() {
      if (ws) {
        ws.onclose = ws.onerror = null;
        try { ws.close(); } catch (_) {}
        ws = null;
      }

      logWS('Connecting to', WS_URL);
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        logWS('Connected to admin server');
        clearTimeout(wsReconnectTimer);
        setupBadge.connected();
        // El agente puede haberse reiniciado y no saber qué hay en pantalla.
        vrLastBusy = null;
        reportBusy();
      };

      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (_) { return; }
        const event = msg.event;
        const data  = msg.data;
        if (!event || !data) return;
        if (event.source === 'System' && event.type === 'Connected') {
          // La app se reinició (quizá actualizada): este HTML puede ser viejo.
          // Recargar trae el overlay que sirve la app de ahora, con su config.
          if (data.boot && bootSeen && bootSeen !== data.boot) {
            log('La app se reinició; se recarga el overlay');
            location.reload();
            return;
          }
          if (data.boot) bootSeen = data.boot;
          return;
        }
        if (event.source === 'General' && event.type === 'Custom'
            && data.action === 'playVideo' && data.reward) {
          log(`playVideo: "${data.reward}" por ${data.user || '?'}`);
          spawnVideo(data.reward);
        } else if (event.source === 'VideoRequests' && data.action === 'playRequest') {
          playRequest(data);
        } else if (data.action === 'reloadConfig') {
          log('Config reload solicitado por el panel');
          loadConfig();
        }
      };

      ws.onclose = (ev) => {
        logWS(`Disconnected (code ${ev.code}) — retry in ${WS_RECONNECT_DELAY}ms`);
        wsReconnectTimer = setTimeout(connect, WS_RECONNECT_DELAY);
      };

      ws.onerror = () => logWS('Error (will reconnect on close)');
    }

    // ── Hotkeys ──────────────────────────────────────────────────────────────
    document.addEventListener('keydown', async (e) => {
      if (e.key === 'r' || e.key === 'R') {
        log('Hot-reloading config…');
        await loadConfig();
      }
    });

    // ── Init ─────────────────────────────────────────────────────────────────
    (async () => {
      await loadConfig();
      connect();
      log('Ready. Use spawnVideo("reward name") in DevTools console to test.');
    })();
  </script>
</body>
</html>
