name: Release

# EXPERIMENTAL CHANNEL. This branch releases under `exp-v*` tags only:
#   git tag exp-v0.3.0 && git push origin exp-v0.3.0
# A plain `v*` tag pushed from this branch builds NOTHING, which is the
# point: the experimental app must never publish over the stable release
# the auto-updater reads.
#
# When this branch merges back, restore the `v*` trigger and the stable
# release name — otherwise stable releases stop building.

on:
  push:
    tags:
      - 'exp-v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build app + create release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts and generates latest.json for the auto-updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          # tauri.conf.json lives in src-tauri/; the CLI finds it from the repo root.
          # No frontend build step (frontendDist is the static src/ folder).
          tagName: ${{ github.ref_name }}
          releaseName: 'Stream Overlay Experimental ${{ github.ref_name }}'
          releaseBody: |
            Instalador de **Stream Overlay Experimental** para Windows.

            > Se instala **al lado** de la versión estable (nombre, carpeta de
            > datos y puerto propios: 3002). No reemplaza ni actualiza la estable.

            > La primera vez, Windows SmartScreen puede avisar que la app no es
            > reconocida (todavía no está firmada). Hacé clic en **Más info →
            > Ejecutar de todas formas** para instalar.
          releaseDraft: true
          prerelease: true
