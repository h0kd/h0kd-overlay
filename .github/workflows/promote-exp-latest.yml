name: Promote exp-latest

# EXPERIMENTAL CHANNEL. The experimental app's auto-updater reads a FIXED url:
#   https://github.com/h0kd/h0kd-overlay/releases/download/exp-latest/latest.json
# It cannot use `releases/latest/download/…` like the stable app does, because
# GitHub's "latest" skips pre-releases (and the experimental releases must
# stay pre-releases so they never become "Latest" for the stable updater).
#
# This workflow keeps that rolling `exp-latest` release pointing at the newest
# PUBLISHED `exp-v*` release: release.yml builds a DRAFT, h0kd reviews and
# publishes it by hand, and that `published` event lands here. Only
# latest.json is copied; the installer stays on the versioned release
# (latest.json links to it by absolute url).
#
# Manual run (GitHub only offers workflow_dispatch for workflows that also
# exist on the default branch, so cherry-pick this file to master first):
#   gh workflow run promote-exp-latest.yml --ref experimental/video-requests -f tag=exp-v0.2.10

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the published release to promote (exp-v*)'
        required: true

permissions:
  contents: write

jobs:
  promote:
    # Stable `v*` releases (and anything else) are ignored on purpose.
    if: startsWith(github.event.inputs.tag || github.event.release.tag_name, 'exp-v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      ROLLING: exp-latest
    steps:
      - name: Fetch latest.json from ${{ env.TAG }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --json isDraft -q .isDraft)
          if [ "$draft" != "false" ]; then
            echo "::error::$TAG is still a draft; publish it first." >&2
            exit 1
          fi
          mkdir -p dist
          gh release download "$TAG" -p latest.json -D dist
          NEW=$(jq -r .version dist/latest.json)
          [ -n "$NEW" ] && [ "$NEW" != "null" ] || { echo "::error::latest.json has no version" >&2; exit 1; }
          echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"
          echo "Promoting $TAG (version $NEW)"

      - name: Refuse to roll back to an older version
        run: |
          set -euo pipefail
          if gh release download "$ROLLING" -p latest.json -D current 2>/dev/null; then
            CUR=$(jq -r .version current/latest.json)
            # sort -V puts the older one first; if the newest is not NEW, bail.
            TOP=$(printf '%s\n%s\n' "$CUR" "$NEW_VERSION" | sort -V | tail -n1)
            if [ "$CUR" != "$NEW_VERSION" ] && [ "$TOP" != "$NEW_VERSION" ]; then
              echo "::error::$ROLLING already points to $CUR, newer than $NEW_VERSION. Not rolling back." >&2
              exit 1
            fi
            echo "$ROLLING currently points to $CUR"
          else
            echo "$ROLLING does not exist yet; it will be created."
          fi

      - name: Create or update the ${{ env.ROLLING }} release
        run: |
          set -euo pipefail
          NOTES=$(printf 'Release rodante que lee el auto-updater de **Stream Overlay Experimental**.\n\nApunta a **%s** (versión %s). No instalar desde acá: bajá el instalador de esa release.\n\n_Actualizada automáticamente por `promote-exp-latest.yml`._' "$TAG" "$NEW_VERSION")
          if gh release view "$ROLLING" >/dev/null 2>&1; then
            gh release edit "$ROLLING" --prerelease --draft=false \
              --title "Stream Overlay Experimental (latest)" --notes "$NOTES"
          else
            # --prerelease is what keeps it out of GitHub's "Latest" slot, which
            # the STABLE app's updater reads. Never drop that flag.
            gh release create "$ROLLING" --prerelease --target "$GITHUB_SHA" \
              --title "Stream Overlay Experimental (latest)" --notes "$NOTES"
          fi
          gh release upload "$ROLLING" dist/latest.json --clobber

      - name: Verify the public url serves the new version
        run: |
          set -euo pipefail
          URL="https://github.com/$GH_REPO/releases/download/$ROLLING/latest.json"
          for i in $(seq 1 12); do
            GOT=$(curl -fsSL "$URL" | jq -r .version || true)
            if [ "$GOT" = "$NEW_VERSION" ]; then
              echo "OK: $URL -> $GOT"
              exit 0
            fi
            echo "attempt $i: got '$GOT', waiting for the CDN…"
            sleep 10
          done
          echo "::error::$URL still does not serve $NEW_VERSION" >&2
          exit 1
