name = "h0kd-video-requests"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# ── D1: fuente de verdad de cola, mods y settings ────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "video-requests"
database_id = "REEMPLAZAR_TRAS_wrangler_d1_create"

# ── Durable Object: un hub de WebSocket por canal ────────────────────────────
[[durable_objects.bindings]]
name = "CHANNEL_HUB"
class_name = "ChannelHub"

# SQLite-backed DO: es el backend recomendado y el único disponible en el plan
# gratuito. `new_sqlite_classes` (no `new_classes`) es lo que lo elige.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelHub"]

[vars]
# El Client ID de Twitch no es secreto (viaja en cada redirect de OAuth).
TWITCH_CLIENT_ID = "REEMPLAZAR"
# Origen público del Worker, usado para armar el redirect_uri de OAuth y la
# URL del callback de EventSub. Sin barra final.
PUBLIC_ORIGIN = "https://h0kd-video-requests.workers.dev"
# Beta cerrado: logins de Twitch separados por coma que pueden dar de alta su
# canal desde /admin. Vacía = abierto (solo para desarrollo).
ALLOWED_CHANNELS = ""

# ── Secrets (NUNCA en este archivo) ──────────────────────────────────────────
# Cargalos con `wrangler secret put <NOMBRE>`:
#   TWITCH_CLIENT_SECRET  secret de la app de Twitch (cliente confidencial)
#   SESSION_SECRET        clave HMAC para firmar las cookies de sesión
#   TOKEN_ENC_KEY         clave AES-GCM (32 bytes en base64) para cifrar los
#                         tokens del broadcaster guardados en D1
#   EVENTSUB_SECRET       secreto compartido con Twitch para firmar los webhooks
