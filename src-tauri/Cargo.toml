# El crate del pipeline vive en el workspace pero NO es dependencia de la app
# todavía: se integra en la fase 4, detrás del feature flag. Así se puede
# compilar y probar por CLI sin tocar el binario que ya funciona.
[workspace]
members = [".", "crates/video-requests-core"]

[package]
name = "stream-overlay"
version = "0.2.9"
description = "Self-hosted Twitch Channel Points video overlay"
authors = ["h0kd"]
edition = "2021"

[lib]
name = "stream_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stream-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
open = "5"
# Solo para la hora local de los logs. `clock` es lo que trae la zona horaria
# del sistema; sin eso habria que llamar a la API de Windows a mano.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# El pipeline vive aparte y sin dependencias de Tauri. Se enlaza siempre,
# pero no se inicializa nada suyo si el flag esta apagado.
video-requests-core = { path = "crates/video-requests-core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
